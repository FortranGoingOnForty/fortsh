[pytest]
testpaths = .
markers =
    known_failure: a test that fails on trunk for a reason unrelated to the
        change under test. CI runs `-m "not known_failure"` so the pipeline
        reflects regressions rather than pre-existing debt. Each mark carries
        a reason; clearing one is a standalone fix, not something to bundle
        into an unrelated feature. Never add this mark to make a test you
        just broke go away — that is what the marker is NOT for.
