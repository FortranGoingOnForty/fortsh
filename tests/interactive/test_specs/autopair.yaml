# Smart quotes and brackets (AR-11 PAIRS)
#
# These assert on what the shell EXECUTED, which is the strongest available
# proof that the closer really landed in the buffer: an unclosed quote or
# bracket would put fortsh into continuation instead of running the line, and
# a doubled closer would be a syntax error.
#
# expect_output is a regex handed to pexpect, and it is matched against the
# whole PTY stream — which includes the terminal echo of what we typed. So
# every expectation below is an ARITHMETIC RESULT (or an expanded variable):
# a string the shell can only produce by evaluating the line. Never assert on
# text that also appears in the keystrokes, or the test passes on the echo
# alone. Screen-level behaviour (cursor position, guards that suppress
# pairing) is covered by test_autopair.py, which reads the rendered buffer.

metadata:
  category: "Autopair"
  description: "Auto-inserted closing quotes/brackets and skip-over on the typed closer"
  phase: 11

tests:
  # =============================================================
  # AUTO-CLOSE — the closer is never typed
  # =============================================================
  - name: "Unclosed double quote and parens are auto-closed"
    steps:
      - send: 'echo "$((6*7'
      - send_key: "Enter"
    expect_output: "42"
    match_type: "contains"

  # The apostrophe must follow a NON-word character to open a pair (guard G2,
  # the one that keeps "don't" intact), hence the space before it here.
  #
  # The arithmetic goes BEFORE the quote so this stays a single step: if the
  # trailing quote were not auto-closed the line would be unterminated, the
  # shell would sit in continuation, and nothing would run at all — so any
  # output proves the close. The earlier two-step form (run, then run a second
  # line and look for its output) timed out on the slower macOS runner.
  - name: "Unclosed single quote does not hang the line in continuation"
    steps:
      - send: "echo $((6*7)) 'q"
      - send_key: "Enter"
    expect_output: "42 q"
    match_type: "contains"

  - name: "Unclosed command substitution paren is auto-closed"
    steps:
      - send: "echo $((6*7"
      - send_key: "Enter"
    expect_output: "42"
    match_type: "contains"

  - name: "Unclosed brace expansion is auto-closed"
    steps:
      - send: "echo ${HOME"
      - send_key: "Enter"
    expect_output: "/"
    match_type: "contains"

  - name: "Nested openers all auto-close in the right order"
    steps:
      - send: "echo $((3*(2+5"
      - send_key: "Enter"
    expect_output: "21"
    match_type: "contains"

  # =============================================================
  # SKIP-OVER — typing the closer walks over it, never doubles it
  # =============================================================
  - name: "Typing every closing paren does not double any of them"
    steps:
      - send: "echo $((6*7))"
      - send_key: "Enter"
    expect_output: "42"
    match_type: "contains"

  - name: "Typing the closing quote does not double it"
    steps:
      - send: 'echo "$((6*7))" done'
      - send_key: "Enter"
    expect_output: "42 done"
    match_type: "contains"

  # Regression: a multi-byte insert must SHIFT the pending closer, not forfeit
  # it. When it forfeited, the trailing quote here stopped skipping over and
  # opened a second string instead, so the line never produced 42.
  - name: "Multi-byte input inside a pair keeps the closer skippable"
    steps:
      - send: "echo '世界' $((6*7"
      - send_key: "Enter"
    expect_output: "42"
    match_type: "contains"

  # =============================================================
  # GUARDS — pairing stays out of the way
  # =============================================================
  - name: "Apostrophe inside a word does not open a pair"
    steps:
      - send: "echo \"don't $((6*7))\""
      - send_key: "Enter"
    expect_output: "don't 42"
    match_type: "contains"

  - name: "Single-quoted text runs unchanged with pairing suppressed"
    steps:
      - send: "echo 'a(b' $((6*7"
      - send_key: "Enter"
    expect_output: "42"
    match_type: "contains"

  # =============================================================
  # BACKSPACE — one keypress undoes an auto-close
  # =============================================================
  - name: "Backspace inside an empty pair removes both halves"
    steps:
      - send: "echo ("
      - send_key: "Backspace"
      - send: "$((6*7"
      - send_key: "Enter"
    expect_output: "42"
    match_type: "contains"

  # =============================================================
  # MOVING PAST A PENDING CLOSER
  # =============================================================
  # NOT an autosuggestion test: FORTSH_TEST_MODE disables autosuggestions
  # outright (update_autosuggestion returns early), so nothing here can
  # exercise the accept path — an earlier version of this case claimed to and
  # passed for the wrong reason. What it does check is that Right-ing over a
  # pending closer leaves a well-formed line. The real accept coverage lives in
  # test_autopair.py, which runs the true renderer and reads the shadow-text
  # colour to tell an accepted suggestion from a displayed one.
  - name: "Right past a pending closer leaves the line well-formed"
    steps:
      - send: 'echo $((6*7)) "pa'
      - send_key: "Right"
      - send_key: "Enter"
    expect_output: "42 pa"
    match_type: "contains"

  # =============================================================
  # set -o autopair
  # =============================================================
  - name: "set +o autopair leaves a fully typed line working"
    steps:
      - send_line: "set +o autopair"
      - send: "echo $((6*7))"
      - send_key: "Enter"
    expect_output: "42"
    match_type: "contains"

  - name: "autopair is listed by set -o and defaults on"
    steps:
      - send_line: "set -o"
    expect_output: "autopair"
    match_type: "contains"
