name: Test Suite

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  # ============================================================================
  # x86_64 Linux (gfortran)
  # ============================================================================
  parallel-build:
    # Guards the per-rule module prerequisites in the Makefile (QUAL-1).
    # A missing prerequisite only fails under -jN, never under -j1.
    name: Parallel Build (-j)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build with make -j$(nproc)
        run: make -j$(nproc)
      - name: Smoke-test binary
        run: test -x bin/fortsh && echo 'echo ok' | ./bin/fortsh
      - name: Staged install honors DESTDIR/PREFIX (as non-root)
        run: |
          dest=$(mktemp -d)
          make DESTDIR="$dest" install
          test -x "$dest/usr/local/bin/fortsh"
          [ "$(stat -c %a "$dest/usr/local/bin/fortsh")" = "755" ]

  repo-hygiene:
    # No generated files in the index (QUAL-5 / QUAL-3): object files,
    # patch rejects, bytecode, virtualenvs, or compiled (ELF/Mach-O) binaries.
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tracked build artifacts
        run: |
          bad=$(git ls-files | grep -E '(\.(o|a|rej|pyc|mod)$|(^|/)(\.venv|__pycache__)/)' || true)
          if [ -n "$bad" ]; then
            echo "Tracked build artifacts found:"; echo "$bad"; exit 1
          fi
      - name: No tracked compiled binaries
        run: |
          bad=$(git ls-files -z | xargs -0 file --mime-type | grep -E 'application/x-(executable|sharedlib|pie-executable|mach-binary)' || true)
          if [ -n "$bad" ]; then
            echo "Tracked compiled binaries found:"; echo "$bad"; exit 1
          fi
      - name: Packaging versions match version.f90
        # fortsh.spec, PKGBUILD, and .SRCINFO drift silently because stale
        # tags still resolve (QUAL-9); version.f90 is the single source.
        run: |
          ver=$(grep -oP 'FORTSH_VERSION = "\K[0-9.]+' src/common/version.f90)
          echo "version.f90: $ver"
          fail=0
          grep -q "^Version:[[:space:]]*$ver\$" fortsh.spec  || { echo "fortsh.spec Version mismatch"; fail=1; }
          grep -q "^pkgver=$ver\$" PKGBUILD                  || { echo "PKGBUILD pkgver mismatch"; fail=1; }
          grep -q "pkgver = $ver\$" .SRCINFO                 || { echo ".SRCINFO pkgver mismatch"; fail=1; }
          exit $fail

  bounds-check:
    # OOB substring bugs in the lexer/parser only abort under
    # -fcheck=bounds (MEM-1, DISC-2); release builds fail silently.
    name: Bounds-Checked Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build debug (-fcheck=bounds)
        run: make debug -j$(nproc)
      - name: Bounds regression suite
        run: ./tests/builtins/test_lexer_parser_bounds.sh

  posix-tests:
    name: POSIX Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build fortsh
        run: make release
      - name: Run POSIX tests
        run: ./tests/run_all_tests.sh --posix-only

  builtin-tests:
    name: Builtin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build fortsh
        run: make release
      - name: Run builtin tests
        run: ./tests/builtins/run_builtin_tests.sh --verbose

  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build fortsh
        run: make release
      - name: Run stress tests
        run: ./tests/builtins/test_stress.sh
        timeout-minutes: 10

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build fortsh
        run: make release
      - name: Run integration tests
        run: ./tests/builtins/integration/run_integration_tests.sh --verbose

  interactive-tests:
    name: Interactive PTY Tests
    if: "!contains(github.event.head_commit.message, '[skip-pty]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fortsh
        run: make release
      - name: Install Python dependencies
        run: |
          cd tests/interactive
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
      - name: Run interactive tests
        run: |
          cd tests/interactive
          source .venv/bin/activate
          python run_tests.py

      # The YAML specs above assert on executed output; these assert on what is
      # RENDERED (cursor position, colours, redraw layout) and cover editing
      # features the specs cannot reach. `-m "not known_failure"` skips tests
      # that already fail on trunk for unrelated reasons — see pytest.ini.
      - name: Run interactive pytest suite
        run: |
          cd tests/interactive
          source .venv/bin/activate
          python -m pytest -q -m "not known_failure"

  # ============================================================================
  # ARM64 Linux (gfortran)
  # ============================================================================
  arm64-linux-interactive:
    name: "ARM64 Linux: Interactive PTY Tests"
    if: "!contains(github.event.head_commit.message, '[skip-pty]')"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fortsh
        run: make release
      - name: Install Python dependencies
        run: |
          cd tests/interactive
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
      - name: Run interactive tests
        run: |
          cd tests/interactive
          source .venv/bin/activate
          python run_tests.py

      # The YAML specs above assert on executed output; these assert on what is
      # RENDERED (cursor position, colours, redraw layout) and cover editing
      # features the specs cannot reach. `-m "not known_failure"` skips tests
      # that already fail on trunk for unrelated reasons — see pytest.ini.
      - name: Run interactive pytest suite
        run: |
          cd tests/interactive
          source .venv/bin/activate
          python -m pytest -q -m "not known_failure"

  arm64-linux-posix:
    name: "ARM64 Linux: POSIX Tests"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build fortsh
        run: make release
      - name: Run POSIX tests
        run: ./tests/run_all_tests.sh --posix-only

  arm64-linux-builtins:
    name: "ARM64 Linux: Builtin Tests"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build fortsh
        run: make release
      - name: Run builtin tests
        run: ./tests/builtins/run_builtin_tests.sh --verbose

  arm64-linux-stress:
    name: "ARM64 Linux: Stress Tests"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build fortsh
        run: make release
      - name: Run stress tests
        run: ./tests/builtins/test_stress.sh
        timeout-minutes: 10

  arm64-linux-integration:
    name: "ARM64 Linux: Integration Tests"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build fortsh
        run: make release
      - name: Run integration tests
        run: ./tests/builtins/integration/run_integration_tests.sh --verbose

  # ============================================================================
  # macOS Apple Silicon (flang-new)
  # ============================================================================
  macos-arm64-posix:
    name: "macOS ARM64: POSIX Tests"
    runs-on: macos-15
    env:
      FC: flang-new
      BASH_REF: /opt/homebrew/bin/bash
    steps:
      - uses: actions/checkout@v4
      - name: Install flang-new and coreutils
        run: brew install flang coreutils bash
      - name: Build fortsh
        run: make release
      - name: Run POSIX tests
        run: ./tests/run_all_tests.sh --posix-only

  macos-arm64-builtins:
    name: "macOS ARM64: Builtin Tests"
    runs-on: macos-15
    env:
      FC: flang-new
      BASH_REF: /opt/homebrew/bin/bash
    steps:
      - uses: actions/checkout@v4
      - name: Install flang-new and coreutils
        run: brew install flang coreutils bash
      - name: Build fortsh
        run: make release
      - name: Run builtin tests
        run: ./tests/builtins/run_builtin_tests.sh --verbose

  macos-arm64-stress:
    name: "macOS ARM64: Stress Tests"
    runs-on: macos-15
    env:
      FC: flang-new
      BASH_REF: /opt/homebrew/bin/bash
    steps:
      - uses: actions/checkout@v4
      - name: Install flang-new and coreutils
        run: brew install flang coreutils bash
      - name: Build fortsh
        run: make release
      - name: Run stress tests
        run: ./tests/builtins/test_stress.sh
        timeout-minutes: 15

  macos-arm64-interactive:
    name: "macOS ARM64: Interactive PTY Tests"
    if: "!contains(github.event.head_commit.message, '[skip-pty]')"
    runs-on: macos-15
    env:
      FC: flang-new
      BASH_REF: /opt/homebrew/bin/bash
    steps:
      - uses: actions/checkout@v4
      - name: Install flang-new and coreutils
        run: brew install flang coreutils bash
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fortsh
        run: make release
      - name: Install Python dependencies
        run: |
          cd tests/interactive
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
      - name: Run interactive tests
        run: |
          cd tests/interactive
          source .venv/bin/activate
          python run_tests.py

      # NOTE: the interactive pytest suite deliberately does NOT run here yet.
      # Enabling it surfaced six macOS-ARM64-only failures that predate it and
      # are unrelated to any one change — command-completion dropping an
      # executable, two menu-scroll edge cases, both --norc cases timing out,
      # and the process menu not populating. They pass on both Linux runners,
      # so marking them known_failure would blind those too. Each needs its own
      # investigation on macOS hardware; add this step back as they are fixed.
      # Full writeup: tests/interactive/MACOS_PYTEST_HANDOFF.md

  macos-arm64-integration:
    name: "macOS ARM64: Integration Tests"
    runs-on: macos-15
    env:
      FC: flang-new
      BASH_REF: /opt/homebrew/bin/bash
    steps:
      - uses: actions/checkout@v4
      - name: Install flang-new and coreutils
        run: brew install flang coreutils bash
      - name: Build fortsh
        run: make release
      - name: Run integration tests
        run: ./tests/builtins/integration/run_integration_tests.sh --verbose
